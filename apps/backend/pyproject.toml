[project]
name = "roadto21km-backend"
version = "0.1.0"
description = "RoadTo21Km backend"
requires-python = ">=3.13"
dependencies = ["injector>=0.24.0", "pydantic-settings>=2.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api", "src/models", "src/services", "src/shared"]
